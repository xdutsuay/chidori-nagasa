name: Pull Request Check

on: pull_request

jobs:

  AndroidTest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls /dev/kvm
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Run unit tests
      run: ./gradlew app:testDebugUnitTest -PskipScreenshots
    - name: Run lint
      run: ./gradlew app:lintDebug
    # Non-blocking for now: the Gradle Managed Device emulator can't boot on
    # GitHub's hosted runner (inherited-from-upstream GMD infra issue — the
    # emulator process exits before the boot snapshot is created, unrelated to
    # app code). Unit tests + lint above are the enforced gates. TODO: replace
    # this GMD step with reactivecircus/android-emulator-runner (KVM-accelerated,
    # reliable on hosted runners) and drop continue-on-error. Tracked separately.
    - name: Run connected android tests
      continue-on-error: true
      run: ./gradlew app:mvdApi35Check -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
